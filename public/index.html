<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAS VEGAS BOARDGAME</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Noto+Sans+KR:wght@500;700;900&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans KR', sans-serif; }
    
    body {
      background: radial-gradient(circle, #2b1f17 0%, #0f0a07 100%);
      color: #f4f4f9; display: flex; height: 100vh; overflow: hidden;
    }

    #lobby-overlay {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88);
      display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(5px);
    }
    .lobby-card {
      background: linear-gradient(145deg, #1f1813, #120d09);
      border: 3px solid #d4af37; padding: 35px; border-radius: 20px;
      width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.9);
    }
    .lobby-card h1 {
      font-family: 'Montserrat', sans-serif; font-size: 36px; font-weight: 900;
      background: linear-gradient(to bottom, #ffe699, #d4af37, #8a6d1c);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 25px;
    }
    .lobby-card input {
      width: 100%; padding: 14px; margin: 10px 0; border-radius: 10px; border: 1px solid #554127;
      background: #0a0705; color: #fff; font-size: 16px; text-align: center; font-weight: bold;
    }

    .btn {
      width: 100%; padding: 14px; margin-top: 12px; border-radius: 10px; border: none;
      background: linear-gradient(180deg, #ffd700 0%, #d4af37 50%, #997a15 100%);
      color: #1a1000; font-weight: 900; font-size: 16px; cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
    .btn-secondary { background: linear-gradient(180deg, #4a3828, #2b1f16); color: #e6c88b; border: 1px solid #73573e; }

    #game-container { display: flex; width: 100%; height: 100%; }
    #main-board { flex: 1; padding: 15px; display: flex; flex-direction: column; overflow-y: auto; }
    #sidebar { width: 320px; background: #0c0805; border-left: 2px solid #2b1f16; display: flex; flex-direction: column; }

    .header-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: linear-gradient(180deg, #211710, #140d09); padding: 12px 20px;
      border-radius: 15px; border: 2px solid #3d2b1f; margin-bottom: 12px;
    }
    .room-tag { background: #d4af37; color: #000; padding: 4px 12px; border-radius: 20px; font-weight: 900; }

    .players-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
    .player-card {
      background: linear-gradient(145deg, #1f1610, #120d09); padding: 12px; border-radius: 12px;
      border: 1px solid #38271b; border-top: 5px solid #888; display: flex; flex-direction: column; transition: all 0.3s;
    }
    .player-card.active { box-shadow: 0 0 15px rgba(212,175,55,0.8); border-color: #d4af37 !important; transform: scale(1.02); }

    .casinos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; flex: 1; padding: 5px; }
    .casino-tile {
      position: relative; width: 100%; height: 100%; min-height: 170px;
      background: radial-gradient(circle at center, #241911 0%, #120b07 100%);
      border: 3px solid #8a6c38; border-radius: 80px 20px 80px 20px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 8px 20px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 15px; overflow: hidden;
    }

    .casino-badge {
      position: absolute; width: 34px; height: 34px; border-radius: 50%;
      background: radial-gradient(circle, #ffffff, #dcdcdc); border: 2px solid #555;
      display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 18px; color: #111; z-index: 5;
    }
    .casino-badge.top-right { top: 10px; right: 15px; }
    .casino-badge.bottom-left { bottom: 10px; left: 15px; }

    .bills-container { display: flex; justify-content: center; align-items: center; margin-top: 5px; z-index: 2; min-height: 40px; }
    
    @keyframes dealBillCard {
      0% { transform: translateY(-120px) scale(0.2) rotate(-20deg); opacity: 0; }
      70% { transform: translateY(10px) scale(1.1) rotate(5deg); opacity: 1; }
      100% { transform: translateY(0) scale(1) rotate(0deg); }
    }
    .real-bill {
      width: 65px; height: 34px; background: linear-gradient(135deg, #2d6a4f, #1b4332);
      border: 2px solid #d8f3dc; border-radius: 5px; color: #d8f3dc; font-weight: 900;
      font-size: 11px; display: flex; justify-content: center; align-items: center;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5); margin-left: -20px; transition: transform 0.2s;
    }
    .real-bill.anim-deal { animation: dealBillCard 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
    .real-bill:first-child { margin-left: 0; }
    .real-bill:hover { transform: translateY(-5px) scale(1.1); z-index: 10; }

    .placed-dice-area { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 5px; width: 100%; max-height: 80px; z-index: 2; padding: 5px; }

    /* =========================================================
       🎲 리얼 3D CUBE 주사위 모션 애니메이션 시스템 
       ========================================================= */
    .controls-panel {
      background: linear-gradient(180deg, #1f1610, #120d09); padding: 15px 20px;
      border-radius: 15px; margin-top: 12px; border: 2px solid #3d2b1f;
      display: flex; align-items: center; justify-content: space-between; min-height: 100px;
    }
    .dice-roll-area { display: flex; gap: 12px; align-items: center; min-height: 60px; flex-wrap: wrap; perspective: 1000px; }

    /* 3D 큐브 컨테이너 */
    .cube-container {
      width: 40px; height: 40px; position: relative; perspective: 600px;
      display: inline-block; transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .cube-3d {
      width: 100%; height: 100%; position: absolute; transform-style: preserve-3d;
      transition: transform 1.2s cubic-bezier(0.1, 0.85, 0.25, 1);
    }

    .cube-face {
      position: absolute; width: 40px; height: 40px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: inset 0 0 8px rgba(0,0,0,0.5), 0 2px 5px rgba(0,0,0,0.4);
    }

    /* 3D 정육면체 6면 위치 잡기 (반지름 20px) */
    .cube-face.face-1 { transform: rotateY(  0deg) translateZ(20px); }
    .cube-face.face-6 { transform: rotateY(180deg) translateZ(20px); }
    .cube-face.face-2 { transform: rotateY( 90deg) translateZ(20px); }
    .cube-face.face-5 { transform: rotateY(-90deg) translateZ(20px); }
    .cube-face.face-3 { transform: rotateX( 90deg) translateZ(20px); }
    .cube-face.face-4 { transform: rotateX(-90deg) translateZ(20px); }

    /* 주사위 점 위치 지정 */
    .dice-dot { position: absolute; width: 8px; height: 8px; border-radius: 50%; background-color: currentColor; transform: translate(-50%, -50%); }
    .dot-center { top: 50%; left: 50%; }
    .dot-tl { top: 25%; left: 25%; }
    .dot-tr { top: 25%; left: 75%; }
    .dot-bl { top: 75%; left: 25%; }
    .dot-br { top: 75%; left: 75%; }
    .dot-ml { top: 50%; left: 25%; }
    .dot-mr { top: 50%; left: 75%; }

    /* 물리 낙하 튕김 키프레임 */
    @keyframes physicsDropBounce {
      0% { transform: translateY(-140px) scale(0.2); opacity: 0; }
      50% { transform: translateY(0px) scale(1.1); opacity: 1; }
      70% { transform: translateY(-25px) scale(0.9); }
      85% { transform: translateY(0px) scale(1.02); }
      95% { transform: translateY(-8px); }
      100% { transform: translateY(0); }
    }
    .anim-physics-drop { animation: physicsDropBounce 0.8s ease-out forwards; }

    /* 정렬(Sort) 그룹화 카드 디자인 */
    .dice-group {
      display: flex; gap: 6px; padding: 6px 12px; background: rgba(0,0,0,0.5);
      border: 2px solid #d4af37; border-radius: 12px; cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: slideInGroup 0.4s ease-out forwards;
    }
    .dice-group:hover { transform: translateY(-4px) scale(1.06); background: rgba(212,175,55,0.25); }

    @keyframes slideInGroup {
      from { transform: translateX(-30px) scale(0.8); opacity: 0; }
      to { transform: translateX(0) scale(1); opacity: 1; }
    }

    /* 2D 정적 주사위 (카지노 타일 내 배치용) */
    .dice-face-2d {
      width: 32px; height: 32px; border-radius: 6px; position: relative;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.4), 0 3px 6px rgba(0,0,0,0.5);
      display: inline-block; border: 1px solid rgba(255,255,255,0.2);
    }

    .color-select-panel { background: rgba(15, 10, 7, 0.9); border: 2px solid #d4af37; border-radius: 12px; padding: 15px; margin-bottom: 12px; text-align: center; }
    .color-picker { display: flex; gap: 12px; justify-content: center; margin-top: 10px; }
    .color-btn { padding: 12px 18px; border-radius: 10px; border: 2px solid transparent; font-weight: bold; cursor: pointer; min-width: 90px; }

    .chat-header { padding: 15px; background: #140d09; font-weight: 900; border-bottom: 1px solid #2b1f16; color: #d4af37; }
    #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; font-size: 13px; }
    .chat-item { line-height: 1.4; word-break: break-all; }
    .chat-sys { color: #d4af37; font-style: italic; }
    .chat-input-area { padding: 12px; display: flex; gap: 6px; background: #080503; }
    .chat-input-area input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #2b1f16; background: #120d09; color: #fff; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(4px); }
    .modal-content { background: linear-gradient(145deg, #1f1610, #120d09); border: 2px solid #d4af37; padding: 30px; border-radius: 15px; width: 440px; text-align: center; }
    .hidden { display: none !important; }
  </style>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <div id="lobby-overlay">
    <div class="lobby-card">
      <h1>LAS VEGAS</h1>
      <input type="text" id="player-name-input" placeholder="닉네임 입력" maxlength="8">
      <button class="btn" onclick="createRoom()">방 생성하기</button>
      <div style="margin: 12px 0; color: #888; font-size: 12px;">OR</div>
      <input type="text" id="room-code-input" placeholder="6자리 방 코드" style="text-transform: uppercase;">
      <button class="btn btn-secondary" onclick="joinRoom()">방 참가하기</button>
    </div>
  </div>

  <div id="game-container">
    <div id="main-board">
      <div class="header-bar">
        <div>
          <h2 style="color: #ffd700;">ROUND <span id="round-num">1</span> / 4</h2>
          <span style="font-size: 12px; color: #bbb;" id="status-text">게임 대기 중...</span>
        </div>
        <div>
          방 코드: <span class="room-tag" id="display-room-code">------</span>
          <button id="start-btn" class="btn hidden" style="width: auto; padding: 8px 18px; margin-left: 10px;" onclick="startGame()">게임 시작</button>
        </div>
      </div>

      <div class="players-bar" id="players-list"></div>

      <div id="color-select-panel" class="color-select-panel hidden">
        <h3 style="color: #ffd700; margin-bottom: 5px;">🎰 1라운드 턴 순서 결정!</h3>
        <p style="font-size: 12px; color: #ccc;">원하는 주사위 색상을 선택하세요. 숨겨진 1~4번 턴이 부여됩니다.</p>
        <div class="color-picker" id="color-buttons-container"></div>
      </div>

      <div class="casinos-grid" id="casinos-container"></div>

      <div class="controls-panel">
        <div>
          <span style="font-size: 12px; color: #d4af37; font-weight: bold;">내 굴린 주사위 (눈 클릭 시 카지노배치):</span>
          <div class="dice-roll-area" id="rolled-dice-area" style="margin-top: 5px;"></div>
        </div>
        <button id="roll-btn" class="btn" style="width: auto; padding: 12px 28px;" onclick="handleRollDiceClick()">주사위 굴리기 🎲</button>
      </div>
    </div>

    <div id="sidebar">
      <div class="chat-header">실시간 채팅</div>
      <div id="chat-messages"></div>
      <div class="chat-input-area">
        <input type="text" id="chat-input" placeholder="메시지 입력..." onkeydown="if(event.key==='Enter') sendChat()">
        <button class="btn" style="width: auto; padding: 10px 14px; margin: 0;" onclick="sendChat()">전송</button>
      </div>
    </div>
  </div>

  <div id="result-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title" style="color: #ffd700; margin-bottom: 15px;">라운드 결과</h2>
      <div id="modal-body" style="text-align: left; margin-bottom: 20px; font-size: 14px;"></div>
      <button id="confirm-btn" class="btn" onclick="confirmResult()">확인 완료</button>
      <button id="next-round-btn" class="btn hidden" style="margin-top: 8px;" onclick="nextRound()">방장: 바로 다음 라운드 진행</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
